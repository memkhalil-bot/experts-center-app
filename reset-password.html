<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور | مركز الخبراء التعليمي</title><style>body{margin:0;background:#f5f7f6;font-family:Tahoma,Arial,sans-serif;color:#15372e;min-height:100dvh;display:grid;place-items:center;padding:18px}main{background:white;max-width:440px;width:100%;border:1px solid #dfebe3;border-radius:17px;padding:28px;box-sizing:border-box;box-shadow:0 12px 40px #14362c14}h1{font-size:23px;margin-top:0}p{line-height:1.9;color:#5d7169}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;min-height:46px;border:1px solid #bccfc4;border-radius:9px;padding:10px;box-sizing:border-box;direction:ltr;font:inherit;font-size:16px}button{width:100%;min-height:46px;background:#146149;border:0;border-radius:9px;color:white;font:inherit;font-weight:bold;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#146149}#message{margin:12px 0;line-height:1.8}form[hidden]{display:none}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><h1>تعيين كلمة مرور جديدة</h1><p id="intro">جارٍ التحقق من رابط استعادة كلمة المرور...</p><form id="reset" hidden><label for="password">كلمة المرور الجديدة</label><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirmation">تأكيد كلمة المرور</label><input id="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save" type="submit">تحديث كلمة المرور</button></form><div id="message" role="status"></div><p><a href="./login.html">العودة لتسجيل الدخول</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const client=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
let recoveryVerified=false;
function showError(){ $('intro').textContent='الرابط غير صالح أو منتهي الصلاحية. ارجع لصفحة تسجيل الدخول واطلب رابط استعادة جديد.';$('reset').hidden=true}
async function ready(){
 const query=new URLSearchParams(location.search),tokenHash=query.get('token_hash'),type=query.get('type');
 if(tokenHash&&type==='recovery'){
  const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
  if(error){showError();return}
  recoveryVerified=true;
 }else{
  const fragment=new URLSearchParams(location.hash.slice(1));
  if(fragment.get('error')||fragment.get('error_code')){showError();return}
  // Supabase recovery links may arrive with an access token in URL fragment.
  if(fragment.get('access_token')&&fragment.get('refresh_token')&&fragment.get('type')==='recovery'){
   const {error}=await client.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
   if(error){showError();return}
   recoveryVerified=true;
  }
 }
 if(!recoveryVerified){showError();return}
 const {data:{user},error}=await client.auth.getUser();
 if(error||!user){showError();return}
 const profile=await client.from('staff_profiles').select('is_active,deleted_at').eq('user_id',user.id).single();
 if(profile.error||!profile.data?.is_active||profile.data?.deleted_at){await client.auth.signOut();$('intro').textContent='الحساب غير نشط. تواصل مع مدير النظام.';return}
 $('intro').textContent='الرابط صالح. اكتب كلمة مرور جديدة من 12 حرفًا على الأقل.';$('reset').hidden=false;
 history.replaceState(null,'','reset-password.html');
}
$('reset').addEventListener('submit',async e=>{e.preventDefault();if(!recoveryVerified)return;const pass=$('password').value;if(pass.length<12||pass!==$('confirmation').value){$('message').textContent='تأكد من تطابق الكلمتين وطول كلمة المرور (12 حرفًا على الأقل).';return}
$('save').disabled=true;const {error}=await client.auth.updateUser({password:pass});if(error){$('message').textContent='تعذر تحديث كلمة المرور: '+error.message;$('save').disabled=false;return}
$('reset').hidden=true;$('intro').textContent='تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.';$('message').textContent='سيتم إنهاء جلسة الاستعادة للأمان.';await client.auth.signOut()});
ready();
</script></body></html>
