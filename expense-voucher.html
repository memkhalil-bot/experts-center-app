<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سند صرف | مركز الخبراء التعليمي</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f3f5f3;color:#17382e;padding:20px}main{max-width:800px;margin:auto;background:#fff;border:1px solid #d8e3db;padding:40px;min-height:650px}header{text-align:center;border-bottom:2px solid #1a604e;padding-bottom:22px}h1{font-size:26px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:32px}.field{border-bottom:1px solid #d7e3d9;padding-bottom:13px}.label{font-size:12px;color:#6a8072;margin-bottom:7px}.value{font-size:17px;font-weight:bold}.sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:100px;text-align:center}.sign>div{border-top:1px solid #385747;padding:12px}button{background:#146448;color:white;border:0;border-radius:10px;padding:12px 23px;cursor:pointer;margin-bottom:15px}.error{color:#b12a2a}@media print{body{background:#fff;margin:0;padding:0}main{border:0;padding:25px}button{display:none}}@media(max-width:550px){main{padding:20px}.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><div style="max-width:800px;margin:auto"><button id="print" hidden onclick="window.print()">طباعة / حفظ PDF</button></div><main><header><h1>مركز الخبراء التعليمي</h1><h2>سند صرف</h2><p>لا يعد هذا السند صالحًا إلا بعد اعتماد الطلب وتأكيد عملية الصرف</p></header><div class="grid" id="fields"></div><div class="sign"><div>إعداد المحاسب</div><div>اعتماد المدير</div><div>استلام المستفيد</div></div><p id="status" role="status">جارٍ التحقق من السند...</p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
function field(label,value){const box=document.createElement('div');box.className='field';const t=document.createElement('div');t.className='label';t.textContent=label;const val=document.createElement('div');val.className='value';val.textContent=value??'—';box.append(t,val);$('fields').append(box)}
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}
const id=new URLSearchParams(location.search).get('id');if(!/^[0-9a-f-]{36}$/i.test(id||'')){$('status').textContent='رقم سند غير صالح';return}
const {data:r,error}=await db.from('expense_requests').select('id,status,amount,category,description,request_date,payment_method,reference_number,reviewed_at,paid_at,created_by,reviewed_by,paid_by,financial_entry_id').eq('id',id).single();
if(error||!r||r.status!=='paid'||!r.financial_entry_id){$('status').textContent='السند غير متاح أو لم يتم الصرف بعد';return}
const {data:f,error:fe}=await db.from('financial_entries').select('id,entry_date,entry_type,amount,reference_number').eq('id',r.financial_entry_id).single();
if(fe||!f||f.entry_type!=='expense'||Number(f.amount)!==Number(r.amount)){$('status').textContent='تعذر التحقق من العملية المالية';return}
const money=Number(r.amount).toLocaleString('ar-QA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.ق';
field('رقم سند الصرف',r.id.slice(0,8).toUpperCase());field('رقم الحركة المالية',f.id.slice(0,8).toUpperCase());
field('تاريخ الاعتماد',r.reviewed_at?.slice(0,10));field('تاريخ الصرف الفعلي',f.entry_date);
field('بند المصروف',r.category);field('المبلغ المصروف',money);
field('وصف العملية',r.description);field('وسيلة الدفع',({cash:'نقدًا',card:'بطاقة',bank:'تحويل بنكي',other:'أخرى'})[r.payment_method]||r.payment_method);
field('مرجع الدفع',r.reference_number||f.reference_number||'—');field('حالة العملية','تم الصرف والاعتماد');
$('status').textContent='سند ناتج عن عملية مالية معتمدة ومحفوظة في النظام';$('print').hidden=false;
})()
</script></body></html>
