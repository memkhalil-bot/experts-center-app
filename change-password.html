<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تغيير كلمة المرور | مركز الخبراء</title><style>body{margin:0;background:#f4f7f5;color:#173b30;font-family:Tahoma,Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:18px;box-sizing:border-box}main{width:min(100%,440px);padding:28px;box-sizing:border-box;background:#fff;border:1px solid #dce9df;border-radius:18px;box-shadow:0 12px 30px #123b3812}h1{font-size:23px}p{line-height:1.8;color:#607267}label{display:block;font-weight:700;margin-top:18px}input{width:100%;box-sizing:border-box;min-height:46px;border-radius:9px;border:1px solid #c6d8cf;margin-top:7px;padding:10px;font-size:16px;direction:ltr}button{background:#12604d;color:white;border:0;border-radius:9px;padding:13px;cursor:pointer;font:inherit;font-weight:700;width:100%;margin-top:22px}button:disabled{opacity:.6}a{color:#12604d}#message{min-height:26px;margin-top:15px;line-height:1.8}form[hidden]{display:none}</style></head><body><main><h1>تغيير كلمة المرور</h1><p>لتأمين حسابك، أدخل كلمة مرورك الحالية ثم اختر كلمة مرور جديدة. لا يلزم إرسال بريد إلكتروني.</p><p id="status">جارٍ التحقق من الحساب...</p><form id="form" hidden><label for="current">كلمة المرور الحالية</label><input id="current" type="password" autocomplete="current-password" required><label for="newPassword">كلمة المرور الجديدة (12 حرفًا على الأقل)</label><input id="newPassword" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><label for="confirm">تأكيد كلمة المرور الجديدة</label><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required><button id="save" type="submit">حفظ كلمة المرور الجديدة</button></form><div id="message" role="status" aria-live="polite"></div><p><a href="./dashboard.html">العودة إلى النظام</a></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
let userEmail='';
(async()=>{const{data:{user},error}=await sb.auth.getUser();if(error||!user){location.replace('./login.html');return}const{data:p,error:e}=await sb.from('staff_profiles').select('is_active,deleted_at').eq('user_id',user.id).single();if(e||!p?.is_active||p.deleted_at){await sb.auth.signOut();location.replace('./login.html');return}userEmail=user.email;$('status').textContent='تم التحقق من الحساب.';$('form').hidden=false})().catch(()=>{$('status').textContent='تعذر التحقق من الحساب. أعد تسجيل الدخول.'});
$('form').addEventListener('submit',async e=>{e.preventDefault();const old=$('current').value,pass=$('newPassword').value,confirmation=$('confirm').value;const msg=$('message');msg.textContent='';if(pass.length<12||pass!==confirmation){msg.textContent='تأكد من تطابق كلمة المرور الجديدة وألا تقل عن 12 حرفًا.';return}if(old===pass){msg.textContent='اختر كلمة مرور مختلفة عن الحالية.';return}const btn=$('save');btn.disabled=true;try{const{error:reauthError}=await sb.auth.signInWithPassword({email:userEmail,password:old});if(reauthError){msg.textContent='كلمة المرور الحالية غير صحيحة.';return}const{error:updateError}=await sb.auth.updateUser({password:pass});if(updateError){msg.textContent='تعذر تغيير كلمة المرور: '+updateError.message;return}msg.textContent='تم تغيير كلمة المرور بنجاح. سجّل الدخول بكلمة المرور الجديدة.';$('form').hidden=true;await sb.auth.signOut()}catch(err){msg.textContent='تعذر إتمام العملية. حاول مرة أخرى.'}finally{btn.disabled=false}});
</script></body></html>
