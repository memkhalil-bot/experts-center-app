<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة المدرس</title><style>body{font-family:Tahoma,Arial;background:#f4f7f5;color:#173d32;margin:0}main{max-width:1050px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce8df;padding:17px;border-radius:12px;margin:12px 0}.muted{color:#65796f;font-size:13px}input,textarea,button{font:inherit;padding:11px;border:1px solid #c9d8d0;border-radius:8px}button{background:#17674e;color:white;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 12px}button:disabled{opacity:.6}#adminTools{background:#fff;border:1px solid #dce8df;padding:18px 22px;border-radius:14px;margin-bottom:17px}#teacherFilter{display:block;width:100%;margin:7px 0 12px;max-width:520px}.admin-heading{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.admin-heading h2{margin:0 0 3px;font-size:18px}.admin-heading .muted{margin:0 0 14px}.nav-action,.empty-action{display:inline-block;background:#14624b;color:white!important;text-decoration:none;border-radius:9px;padding:10px 17px;font-weight:700;font-size:13px}.empty-state{text-align:center;background:white;border:1px dashed #c7ddd0;border-radius:15px;padding:45px 24px;margin-top:20px}.empty-state h2{margin:0 0 9px;font-size:20px}.empty-state p{color:#64786b;margin:0 auto 19px;max-width:560px}.empty-icon{display:block;font-size:34px;margin-bottom:15px}.empty-action{margin-top:6px}@media(max-width:700px){main{padding:15px}.admin-heading{align-items:start}.empty-state{padding:30px 15px}}.teacher-name{color:#306c55;font-size:13px;font-weight:700}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><h1 id="portalTitle">بوابة المدرس — حصصي</h1><p id="portalDescription" class="muted">عرض حصصك وتسجيل وقت البداية والنهاية لإرسالها إلى الإدارة للمراجعة.</p><section id="adminTools" class="admin-panel" hidden><div class="admin-heading"><div><h2>حصص المدرسين</h2><p class="muted">اختر مدرسًا لمتابعة حصصه أو اعرض جميع المدرسين.</p></div><a class="nav-action" id="addLesson" href="./operations.html">+ إدارة الحصص</a></div><label for="teacherFilter">تصفية حسب المدرس</label><select id="teacherFilter"><option value="">جميع المدرسين</option></select><p class="muted">يمكنك مراجعة الحصص هنا. تقديم الحصة وإرسالها يتم من حساب المدرس نفسه.</p></section><div id="list">جارٍ التحقق من حساب المدرس...</div><p id="result" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=x=>document.getElementById(x);
let adminMode=false,teacherNames=new Map();
function emptyState(teacher){const list=$('list');list.replaceChildren();const panel=document.createElement('section');panel.className='empty-state';const icon=document.createElement('span');icon.className='empty-icon';icon.setAttribute('aria-hidden','true');icon.textContent='▤';const title=document.createElement('h2');title.textContent=adminMode?'لا توجد حصص مسجلة حتى الآن':'لا توجد حصص مرتبطة بحسابك';const description=document.createElement('p');description.textContent=adminMode?(teacher?'لم يتم تسجيل حصص لهذا المدرس. يمكنك إضافتها من إدارة الحصص.':'لم تتم إضافة أي حصص للمدرسين بعد. أضف أول حصة من صفحة الحصص والخدمات لتظهر هنا.'): 'ستظهر حصصك هنا بعد أن تقوم الإدارة بجدولتها لك.';panel.append(icon,title,description);if(adminMode){const link=document.createElement('a');link.className='empty-action';link.href='./operations.html';link.textContent='الانتقال إلى إدارة الحصص';link.onclick=e=>{if(window.parent!==window){e.preventDefault();parent.postMessage({type:'alkhubara:navigate',route:'operations'},location.origin)}};panel.append(link)}list.append(panel)}
async function display(teacher){let query=db.from('lessons').select('id,teacher_id,lesson_date,start_time,end_time,subject,status,lesson_location,lesson_total_price').eq('is_archived',false).order('lesson_date',{ascending:false}).limit(100);if(teacher)query=query.eq('teacher_id',teacher);const {data,error}=await query;const list=$('list');list.replaceChildren();if(error){list.textContent=error.message;return}if(!data.length){emptyState(teacher);return}
for(const l of data){const el=document.createElement('section');el.className='card';const h=document.createElement('h3');h.textContent=l.subject+' · '+l.lesson_date;el.append(h);if(adminMode){const teacherLabel=document.createElement('div');teacherLabel.className='teacher-name';teacherLabel.textContent='المدرس: '+(teacherNames.get(l.teacher_id)||'غير معروف');el.append(teacherLabel)}const p=document.createElement('p');p.className='muted';p.textContent='الحالة: '+l.status+' | المكان: '+l.lesson_location;el.append(p);if(adminMode&&l.lesson_total_price!=null){const amount=document.createElement('p');amount.textContent='قيمة الحصة: '+Number(l.lesson_total_price).toFixed(2)+' ر.ق';el.append(amount)}
if(!adminMode&&['scheduled','confirmed'].includes(l.status)){const start=document.createElement('input');start.type='time';start.value=l.start_time?.slice(0,5)||'09:00';const end=document.createElement('input');end.type='time';end.value=l.end_time?.slice(0,5)||'10:00';const priceLabel=document.createElement('label');priceLabel.textContent='قيمة الحصة كاملة (50–2000 ريال)';const price=document.createElement('input');price.type='number';price.min='50';price.max='2000';price.step='0.01';price.required=true;price.inputMode='decimal';price.placeholder='مثال: 150';price.value=l.lesson_total_price??'';const notes=document.createElement('textarea');notes.placeholder='ملاحظات المدرس عن الحصة';const btn=document.createElement('button');btn.textContent='إرسال الحصة للمراجعة';btn.onclick=async()=>{const value=Number(price.value);if(!price.value||value<50||value>2000){$('result').textContent='حدد سعر الحصة بين 50 و2000 ريال';return}btn.disabled=true;const priced=await db.rpc('set_lesson_price',{p_lesson_id:l.id,p_total:value});if(priced.error){$('result').textContent='تعذر تسجيل السعر: '+priced.error.message;btn.disabled=false;return}const{error}=await db.rpc('teacher_lessons_submit',{p_lesson_id:l.id,p_start:start.value,p_end:end.value,p_notes:notes.value});$('result').textContent=error?'فشل الإرسال: '+error.message:'تم إرسال الحصة وتأكيد أوقاتها؛ بانتظار اعتماد الإدارة.';btn.disabled=false;if(!error)display(teacher)};el.append('وقت البداية',start,'وقت النهاية',end,priceLabel,price,notes,btn)}list.append(el)}}
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}
const{data:p,error}=await db.from('staff_profiles').select('teacher_id,is_active,role,deleted_at').eq('user_id',user.id).single();
if(error||!p?.is_active||p.deleted_at){location.replace('./login.html');return}
adminMode=p.role==='super_admin';
if(adminMode){
 $('portalTitle').textContent='إدارة ومتابعة حصص المدرسين';
 $('portalDescription').textContent='عرض ومتابعة حصص جميع المدرسين من مكان واحد، دون تغيير صلاحياتهم أو تسجيل الحصص بالنيابة عنهم.';
 $('adminTools').hidden=false;
 $('addLesson').onclick=e=>{if(window.parent!==window){e.preventDefault();parent.postMessage({type:'alkhubara:navigate',route:'operations'},location.origin)}};
 $('list').textContent='جارٍ تحميل حصص المدرسين...';
 const{data:teachers,error:teacherError}=await db.from('teachers').select('id,full_name').eq('is_archived',false).order('full_name').limit(1000);
 if(teacherError){$('list').textContent='تعذر تحميل المدرسين: '+teacherError.message;return}
 const select=$('teacherFilter');
 for(const t of teachers||[]){teacherNames.set(t.id,t.full_name);const option=document.createElement('option');option.value=t.id;option.textContent=t.full_name;select.append(option)}
 select.addEventListener('change',()=>display(select.value||null));
 await display(null);return
}
if(!p.teacher_id){$('list').textContent='حسابك لم يرتبط بعد بسجل مدرس. اطلب من مدير النظام ربط حسابك.';return}
const{data:permissions,error:permError}=await db.from('user_permissions').select('permission').eq('user_id',user.id);
if(permError||!(permissions||[]).some(x=>x.permission==='teacher.portal')){$('list').textContent='ليس لديك صلاحية بوابة المدرس';return}
await display(p.teacher_id)
})()
</script></body></html>
