<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بوابة المدرس</title><style>body{font-family:Tahoma,Arial;background:#f4f7f5;color:#173d32;margin:0}main{max-width:1050px;margin:auto;padding:24px}.card{background:white;border:1px solid #dce8df;padding:17px;border-radius:12px;margin:12px 0}.muted{color:#65796f;font-size:13px}input,textarea,button{font:inherit;padding:11px;border:1px solid #c9d8d0;border-radius:8px}button{background:#17674e;color:white;cursor:pointer}input,textarea{width:100%;box-sizing:border-box;margin:6px 0 12px}button:disabled{opacity:.6}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><h1>بوابة المدرس — حصصي</h1><p class="muted">تأكيد تقديم الحصة وإدخال وقتي البداية والنهاية. لا تظهر البيانات المالية أو معلومات الاتصال بالطلاب.</p><div id="list">جارٍ التحقق من حساب المدرس...</div><p id="result" role="status"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=x=>document.getElementById(x);
async function display(teacher){const {data,error}=await db.from('lessons').select('id,lesson_date,start_time,end_time,subject,status,lesson_location').eq('teacher_id',teacher).eq('is_archived',false).order('lesson_date',{ascending:false}).limit(100);const list=$('list');list.replaceChildren();if(error){list.textContent=error.message;return}if(!data.length){list.textContent='لا توجد حصص مرتبطة بحسابك';return}
for(const l of data){const el=document.createElement('section');el.className='card';const h=document.createElement('h3');h.textContent=l.subject+' · '+l.lesson_date;el.append(h);const p=document.createElement('p');p.className='muted';p.textContent='الحالة: '+l.status+' | المكان: '+l.lesson_location;el.append(p);
if(['scheduled','confirmed'].includes(l.status)){const start=document.createElement('input');start.type='time';start.value=l.start_time?.slice(0,5)||'09:00';const end=document.createElement('input');end.type='time';end.value=l.end_time?.slice(0,5)||'10:00';const notes=document.createElement('textarea');notes.placeholder='ملاحظات المدرس عن الحصة';const btn=document.createElement('button');btn.textContent='إرسال الحصة للمراجعة';btn.onclick=async()=>{btn.disabled=true;const{error}=await db.rpc('teacher_lessons_submit',{p_lesson_id:l.id,p_start:start.value,p_end:end.value,p_notes:notes.value});$('result').textContent=error?'فشل الإرسال: '+error.message:'تم إرسال الحصة وتأكيد أوقاتها؛ بانتظار اعتماد الإدارة.';btn.disabled=false;if(!error)display(teacher)};el.append('وقت البداية',start,'وقت النهاية',end,notes,btn)}list.append(el)}}
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}const{data:p,error}=await db.from('staff_profiles').select('teacher_id,is_active,role').eq('user_id',user.id).single();if(error||!p?.is_active){location.replace('./login.html');return}if(!p.teacher_id){$('list').textContent='حسابك لم يرتبط بعد بسجل مدرس. اطلب من مدير النظام ربط حسابك.';return}display(p.teacher_id)})()
</script></body></html>
